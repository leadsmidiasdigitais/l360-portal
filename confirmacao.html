<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Confirmação</title>

<link rel="stylesheet"
href="assets/css/style.css">

<body>

<main class="confirmation">

<h1>

Confirme seu e-mail

</h1>

<p>

Enviamos um código de confirmação para:

</p>

<strong id="emailDestino"></strong>

<input

id="codigo"

placeholder="000000">

</button>

</main>

<script>

document.getElementById("emailDestino").innerHTML=

localStorage.getItem("l360_email");

document.getElementById("confirmar")

.addEventListener("click",()=>{

window.location.href="plano.html";

});

</script>
